:root {
  color-scheme: light;
  --paper: #ECE9DA;      /* yosun kâğıdı */
  --paper-2: #F6F4EA;
  --ink: #2E2A22;        /* ağaç kabuğu */
  --ink-2: #6B6454;
  --line: #D6D0BA;
  --moss: #45613A;       /* yosun */
  --moss-ink: #F4F1E4;
  --leaf-past: #A0B18B;
  --leaf-future: #C8CFAF;
  --berry: #A8323E;      /* kızılcık: regl */
  --berry-soft: #EDD3CF;
  --on-berry: #FBF1EC;
  --sprout: #8FAA5A;     /* filiz: doğurgan */
  --sprout-soft: #D7E2BB;
  --gold: #C6972F;       /* palamut: ovulasyon */
  --hazel: #8E522F;      /* fındık */
  --rib: rgba(46, 42, 34, .14);
  --toast-act: #E2B04A;
  --shadow: 0 -12px 34px rgba(40, 36, 24, .16);
  --serif: 'Alegreya', 'Iowan Old Style', Georgia, serif;
  --sans: 'Alegreya Sans', -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #161B14; --paper-2: #1F261C; --ink: #ECE7D7; --ink-2: #A9A28F; --line: #333C2D;
    --moss: #95B27D; --moss-ink: #132010; --leaf-past: #637B55; --leaf-future: #2F3A2A;
    --berry: #D8636E; --berry-soft: #4A262B; --on-berry: #1C0E10;
    --sprout: #9DBB67; --sprout-soft: #2F3C24; --gold: #DDB04F; --hazel: #CB8C5C;
    --rib: rgba(0, 0, 0, .22); --toast-act: #7A5A16; --shadow: 0 -12px 34px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #161B14; --paper-2: #1F261C; --ink: #ECE7D7; --ink-2: #A9A28F; --line: #333C2D;
  --moss: #95B27D; --moss-ink: #132010; --leaf-past: #637B55; --leaf-future: #2F3A2A;
  --berry: #D8636E; --berry-soft: #4A262B; --on-berry: #1C0E10;
  --sprout: #9DBB67; --sprout-soft: #2F3C24; --gold: #DDB04F; --hazel: #CB8C5C;
  --rib: rgba(0, 0, 0, .22); --toast-act: #7A5A16; --shadow: 0 -12px 34px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 17px/1.45 var(--sans);
  -webkit-tap-highlight-color: transparent;
  font-kerning: normal;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; }

#app {
  max-width: 460px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 20px calc(env(safe-area-inset-bottom, 0px) + 96px);
}
#app.onb { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); }
#app.onb .top, #app.onb .tabs { display: none; }

/* Üst satır */
.top { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 2px 0; }
.wordmark { font: italic 650 27px/1 var(--serif); color: var(--moss); }
.top .date { font-size: 15px; color: var(--ink-2); }

/* Bugün */
.note-install {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  width: 100%; margin: 14px 0 0; padding: 12px 14px; text-align: left;
  border: 1.5px dashed var(--hazel); border-radius: 14px; background: transparent;
  font-size: 15px; line-height: 1.35; color: var(--ink);
}
.note-install .go { color: var(--hazel); font-weight: 700; white-space: nowrap; }
.note-demo {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin: 14px 0 0; padding: 8px 10px 8px 14px; border-radius: 14px;
  background: var(--sprout-soft); color: var(--ink); font-size: 15px; line-height: 1.35;
}
.note-demo button { background: none; border: 0; padding: 8px 4px; color: var(--moss); font-weight: 700; white-space: nowrap; }
.note-warn {
  margin: 14px 0 0; padding: 12px 14px; border-radius: 14px;
  background: var(--berry-soft); color: var(--ink); font-size: 15px; line-height: 1.35;
}

.hero { text-align: center; }
.wreath { position: relative; width: min(84vw, 320px); aspect-ratio: 1; margin: 10px auto 0; }
.wreath-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.wreath.intro .dd { animation: leafIn .45s ease-out both; animation-delay: calc(var(--i) * 24ms + 80ms); }
@keyframes leafIn { from { opacity: 0; } to { opacity: 1; } }
.vine { fill: none; stroke: var(--line); stroke-width: 1.6; }
.vine-done { fill: none; stroke: var(--leaf-past); stroke-width: 2.4; stroke-linecap: round; }
.lf.duz.past { fill: var(--leaf-past); }
.lf.duz.today { fill: var(--moss); }
.lf.duz.future { fill: var(--leaf-future); }
.lf.dogurgan { fill: var(--sprout); }
.lf.dogurgan.future { opacity: .8; }
.lf.gecikme { fill: var(--hazel); opacity: .8; }
.rib { stroke: var(--rib); stroke-width: 1.1; stroke-linecap: round; fill: none; }
.b-on { fill: var(--berry); }
.b-hi { fill: #fff; opacity: .45; }
.b-pred { fill: var(--berry-soft); stroke: var(--berry); stroke-width: 1.4; }
.ovu { fill: var(--gold); }
.ovu-ring { fill: none; stroke: var(--gold); stroke-width: 1.3; opacity: .55; }
.today-ring { fill: none; stroke: var(--ink); stroke-width: 1.5; }

.mascot {
  position: absolute; left: 50%; top: 50%; width: 62%; aspect-ratio: 1;
  transform: translate(-50%, -51%); border: 0; padding: 0; background: none; border-radius: 50%;
}
.mascot svg { display: block; width: 100%; height: 100%; transform-origin: 50% 92%; }
.mascot.hop svg { animation: hop .5s cubic-bezier(.3, .7, .4, 1); }
@keyframes hop {
  0% { transform: none; }
  35% { transform: translateY(-9%) scale(.97, 1.04); }
  65% { transform: translateY(0) scale(1.04, .96); }
  100% { transform: none; }
}

.headline { font: 600 34px/1.1 var(--serif); margin: 14px 0 4px; letter-spacing: -.2px; }
.phase { font: italic 400 21px/1.3 var(--serif); color: var(--moss); margin: 0; }

.rows { margin: 26px 0 22px; padding: 0; }
.row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 12px; padding: 13px 2px; border-top: 1px solid var(--line); }
.row:last-child { border-bottom: 1px solid var(--line); }
.row dt { color: var(--ink-2); font-size: 16px; }
.row dd { margin: 0; text-align: right; }
.row .val { display: block; font: 600 20px/1.2 var(--serif); }
.row .sub { display: block; font-size: 14px; color: var(--ink-2); margin-top: 2px; }

/* Düğmeler */
.btn {
  display: block; width: 100%; min-height: 52px; padding: 0 20px;
  border: 0; border-radius: 26px; font-size: 18px; font-weight: 700;
  transition: transform .12s ease;
}
.btn:active { transform: scale(.98); }
.btn.big { min-height: 58px; border-radius: 29px; }
.btn.berry { background: var(--berry); color: var(--on-berry); }
.btn.moss { background: var(--moss); color: var(--moss-ink); }
.btn.line { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink); }
.btn.ghost { background: transparent; color: var(--ink-2); font-weight: 400; min-height: 46px; }
.btn.danger { background: transparent; color: var(--berry); box-shadow: inset 0 0 0 1.5px currentColor; }
.link-btn {
  display: block; margin: 10px auto 0; padding: 14px; background: none; border: 0;
  color: var(--ink-2); font-size: 16px; text-decoration: underline; text-underline-offset: 3px;
}

/* Sekmeler */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; justify-content: center; gap: 4px;
  padding: 6px 12px calc(env(safe-area-inset-bottom, 0px) + 6px);
  background: var(--paper);
  background: color-mix(in srgb, var(--paper) 90%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.tabs button { position: relative; flex: 1; max-width: 140px; padding: 12px 0 14px; background: none; border: 0; font-size: 16px; color: var(--ink-2); }
.tabs button[aria-current="page"] { color: var(--ink); font-weight: 700; }
.tabs button[aria-current="page"]::after {
  content: ''; position: absolute; left: 50%; bottom: 5px; width: 15px; height: 6px; margin-left: -7.5px;
  background: var(--moss); border-radius: 0 6px 0 6px;
}

/* Takvim */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 12px; }
.cal-head h1 { font: 600 26px/1.1 var(--serif); margin: 0; }
.nav-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent;
  box-shadow: inset 0 0 0 1.5px var(--line); font: 400 26px/1 var(--serif); color: var(--ink);
}
.wk { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 13px; color: var(--ink-2); padding-bottom: 6px; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
.day {
  position: relative; aspect-ratio: 1; padding: 0; border: 0; background: none;
  display: grid; place-items: center; font-size: 16px; color: var(--ink);
}
.day.empty { pointer-events: none; }
.day::before { content: ''; position: absolute; top: 14%; bottom: 14%; left: 0; right: 0; z-index: 0; }
.day.band-r::before { background: var(--berry); }
.day.band-g::before { background: var(--sprout-soft); }
.day.bs::before { left: 7%; border-radius: 999px 0 0 999px; }
.day.be::before { right: 7%; border-radius: 0 999px 999px 0; }
.day.bs.be::before { border-radius: 999px; }
.day span {
  position: relative; z-index: 1; width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; font-variant-numeric: lining-nums tabular-nums;
}
.day.band-r { color: var(--on-berry); font-weight: 700; }
.day.regl-tahmin span { border: 1.6px dashed var(--berry); color: var(--berry); }
.day.ovulasyon span { box-shadow: inset 0 0 0 2px var(--gold); font-weight: 700; }
.day.today span { font-weight: 700; }
.day.today span::after {
  content: ''; position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px; margin-left: -2.5px;
  border-radius: 50%; background: currentColor;
}
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 0; margin: 16px 0 0; font-size: 14px; color: var(--ink-2); }
.legend li { display: flex; align-items: center; gap: 7px; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box; }
.sw-r { background: var(--berry); }
.sw-p { border: 1.6px dashed var(--berry); }
.sw-g { background: var(--sprout-soft); box-shadow: inset 0 0 0 1px var(--sprout); }
.sw-o { box-shadow: inset 0 0 0 2px var(--gold); }

.hist { margin-top: 32px; }
.hist h2, .set h2 { font: 600 22px/1.2 var(--serif); margin: 0 0 6px; }
.hist .summary { color: var(--ink-2); margin: 0 0 12px; }
.hrow { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px 2px; border-top: 1px solid var(--line); }
.hrow:last-child { border-bottom: 1px solid var(--line); }
.hrow .when { display: block; font: 600 18px/1.25 var(--serif); }
.hrow .meta { display: block; font-size: 14px; color: var(--ink-2); }
.hrow .right { text-align: right; }

/* Ayarlar */
.set { margin: 26px 0 0; }
.set p { margin: 0 0 8px; }
.step-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px; border-top: 1px solid var(--line); }
.set .step-row:last-of-type { border-bottom: 1px solid var(--line); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button {
  width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent;
  box-shadow: inset 0 0 0 1.5px var(--line); font-size: 22px; line-height: 1; color: var(--ink);
}
.stepper output { min-width: 66px; text-align: center; font: 600 20px/1 var(--serif); font-variant-numeric: lining-nums; }
.row-btn {
  display: block; width: 100%; padding: 14px 2px; text-align: left;
  background: none; border: 0; border-top: 1px solid var(--line); font-size: 17px; color: var(--ink);
}
.set .row-btn:last-of-type { border-bottom: 1px solid var(--line); }
.hint { font-size: 14px; color: var(--ink-2); margin: 8px 0 0; }
.set .hint { margin-top: 10px; }
.set .btn.danger { margin-top: 6px; }
.version { text-align: center; color: var(--ink-2); font-size: 13px; margin-top: 18px; }

/* Alt sayfa */
.sheet[hidden] { display: none; }
.sheet { position: fixed; inset: 0; z-index: 20; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(24, 22, 14, .4); opacity: 0; transition: opacity .2s; }
.sheet.open .sheet-backdrop { opacity: 1; }
.sheet-panel {
  position: absolute; left: 0; right: 0; bottom: 0; max-width: 460px; max-height: 88vh; margin: 0 auto; overflow-y: auto;
  padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 18px);
  background: var(--paper-2); border-radius: 24px 24px 0 0; box-shadow: var(--shadow);
  transform: translateY(100%); transition: transform .24s cubic-bezier(.2, .8, .2, 1);
}
.sheet.open .sheet-panel { transform: none; }
.sheet-grip { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet-title { font: 600 24px/1.2 var(--serif); margin: 0 0 6px; }
.sheet-info { color: var(--ink-2); margin: 0; }
.sheet-body p { margin: 0 0 8px; }
.sheet-actions { display: grid; gap: 10px; margin-top: 18px; }
.note { font: italic 400 22px/1.5 var(--serif); margin: 10px 0 0; }
.sign { text-align: right; font: italic 650 21px/1 var(--serif); color: var(--moss); margin: 14px 4px 0 0; }

/* Bildirim balonu */
.toast[hidden] { display: none; }
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 82px); z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: min(92vw, 420px); padding: 11px 12px 11px 16px;
  background: var(--ink); color: var(--paper); border-radius: 14px; font-size: 15px;
  opacity: 0; transform: translate(-50%, 10px); transition: opacity .18s, transform .18s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast button { background: none; border: 0; padding: 6px 4px; color: var(--toast-act); font-weight: 700; white-space: nowrap; }
#app.onb ~ .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); }

/* İlk açılış */
.onb-hos { text-align: center; padding-top: 5vh; }
.onb-mascot { width: min(60vw, 230px); margin: 0 auto; }
.onb-mascot svg, .onb-mini svg { display: block; width: 100%; height: auto; }
.onb-word { font: italic 700 58px/1 var(--serif); color: var(--moss); margin: 4px 0 12px; letter-spacing: -.5px; }
.onb-lead { font: 400 22px/1.35 var(--serif); margin: 0 auto 16px; max-width: 21ch; }
.onb-privacy { font-size: 16px; color: var(--ink-2); max-width: 33ch; margin: 0 auto 30px; }
.onb-sec { padding-top: 2vh; }
.onb-mini { width: 92px; margin: 6px 0 0 -6px; }
.onb-sec h1 { font: 600 30px/1.15 var(--serif); margin: 10px 0 12px; }
.onb-sec p { margin: 0 0 10px; }
.steps { margin: 16px 0; padding-left: 1.5em; }
.steps li { margin: 0 0 10px; padding-left: 4px; }
.steps li::marker { font: 600 18px var(--serif); color: var(--hazel); }
.onb-buttons { margin-top: 26px; }
.date-field { position: relative; display: block; }
.date-display {
  display: flex; align-items: center; min-height: 56px; padding: 0 16px;
  border-radius: 14px; box-shadow: inset 0 0 0 1.5px var(--line); background: var(--paper-2);
  font: 600 20px/1.2 var(--serif); color: var(--ink);
}

.date-field input {
  position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; margin: 0; padding: 0;
  -webkit-appearance: none; appearance: none; font-size: 16px; cursor: pointer;
}
.q { margin-top: 28px; }

.q .step-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.q .step-row { border: 0; padding: 4px 0; justify-content: flex-start; }

}

<body>
<div id="app">
  <header class="top"><span class="wordmark">Sincap</span><span class="date" id="today"></span></header>
  <main id="view"></main>
  <nav class="tabs" aria-label="Bölümler">
    <button type="button" data-tab="bugun">Bugün</button>

</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript>Sincap'in çalışması için JavaScript gerekli.</noscript>
<script>
(() => {
'use strict';
/* ---------- Sincap maskotu (özgün SVG) ---------- */
const M = {
  fur: '#B4683A', furDark: '#96532D', tail: '#A45B30', tailLight: '#C98650',
  cream: '#F4E4C8', blush: '#E8907C', ink: '#2B1D16', nose: '#4A2B1F', earIn: '#E7B79D',
  moss: '#5C7A48', mossDark: '#48633A', berry: '#B5414C', berryDark: '#94323D',
  sprout: '#8FAA5A', sproutDark: '#6B8741', gold: '#D4A23A', nut: '#8A5530', nutLight: '#D8B98A'
};

function star(cx, cy, r, fill) {
  const k = r * 0.2;
  return `<path d="M${cx} ${cy - r} Q${cx + k} ${cy - k} ${cx + r} ${cy} Q${cx + k} ${cy + k} ${cx} ${cy + r} Q${cx - k} ${cy + k} ${cx - r} ${cy} Q${cx - k} ${cy - k} ${cx} ${cy - r}Z" fill="${fill}"/>`;
}

function nutShape(cx, cy, s) {
  // fındık: sivri uçlu yuvarlak gövde + açık renkli taban
  const p = (x, y) => `${(cx + x * s).toFixed(1)} ${(cy + y * s).toFixed(1)}`;
  return `<g>
    <path d="M${p(0, -14)} C${p(10, -13)} ${p(15, -3)} ${p(12, 6)} C${p(9, 14)} ${p(-9, 14)} ${p(-12, 6)} C${p(-15, -3)} ${p(-10, -13)} ${p(0, -14)}Z" fill="${M.nut}"/>
    <path d="M${p(-11, 5)} C${p(-6, 13)} ${p(6, 13)} ${p(11, 5)} C${p(6, 8)} ${p(-6, 8)} ${p(-11, 5)}Z" fill="${M.nutLight}"/>
    <ellipse cx="${(cx - 4 * s).toFixed(1)}" cy="${(cy - 6 * s).toFixed(1)}" rx="${(2.6 * s).toFixed(1)}" ry="${(4.5 * s).toFixed(1)}" fill="#B07A4C" opacity=".8"/>
  </g>`;
}

/* Varyantlar: regl (battaniye + termofor), enerjik (yaprak), parilti (ışıltı),
   findik (fındık), sakin (ikon için, sade duruş) */
function mascotSVG(variant = 'enerjik', label = 'Sincap') {
  const v = variant;
  const cheekR = v === 'findik' ? 18.5 : 17;

  const tail = [[80,166,22],[60,158,23],[44,140,24],[36,116,24],[38,92,23],[46,70,21],[60,52,19],[76,40,16],[92,35,12]]
    .map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('');
  const tailHi = `<path d="M74 160 C52 152 40 130 42 104 C44 80 54 62 72 50" fill="none" stroke="${M.tailLight}" stroke-width="13" stroke-linecap="round" opacity=".85"/>
    <path d="M60 140 C52 124 50 106 54 88" fill="none" stroke="#DDA36E" stroke-width="4" stroke-linecap="round" opacity=".55"/>`;

  const glow = v === 'parilti'
    ? `<circle cx="112" cy="100" r="96" fill="url(#sc-glow)"/>` : '';

  const openEyes = (big) => `
    <ellipse cx="95" cy="88" rx="5.2" ry="6.6" fill="${M.ink}"/>
    <ellipse cx="129" cy="88" rx="5.2" ry="6.6" fill="${M.ink}"/>
    <circle cx="96.9" cy="85.4" r="${big ? 2.5 : 1.9}" fill="#fff"/>
    <circle cx="130.9" cy="85.4" r="${big ? 2.5 : 1.9}" fill="#fff"/>
    <circle cx="93.5" cy="90.8" r="${big ? 1.2 : 0.9}" fill="#fff" opacity=".9"/>
    <circle cx="127.5" cy="90.8" r="${big ? 1.2 : 0.9}" fill="#fff" opacity=".9"/>`;
  const closedEyes = `
    <path d="M89.5 88.5 Q95 93.5 100.5 88.5" fill="none" stroke="${M.ink}" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M123.5 88.5 Q129 93.5 134.5 88.5" fill="none" stroke="${M.ink}" stroke-width="2.3" stroke-linecap="round"/>`;

  const blanket = v === 'regl' ? `
    <clipPath id="sc-bl"><path d="M70 122 C84 110 140 110 154 122 L161 188 C146 195 78 195 63 188Z"/></clipPath>
    <path d="M70 122 C84 110 140 110 154 122 L161 188 C146 195 78 195 63 188Z" fill="${M.moss}"/>
    <g clip-path="url(#sc-bl)" stroke="${M.cream}" stroke-width="3" opacity=".55">
      <line x1="55" y1="146" x2="170" y2="146"/><line x1="55" y1="166" x2="170" y2="166"/><line x1="55" y1="182" x2="170" y2="182"/>
    </g>
    <path d="M70 122 C84 113 140 113 154 122 C140 129 84 129 70 122Z" fill="${M.mossDark}"/>` : '';

  const feet = v === 'regl' ? '' : `
    <ellipse cx="92" cy="184" rx="15" ry="8" fill="${M.furDark}"/>
    <ellipse cx="132" cy="184" rx="15" ry="8" fill="${M.furDark}"/>`;

  let front = '';
  if (v === 'regl') {
    front = `
      <rect x="106" y="114" width="12" height="9" rx="3" fill="${M.berryDark}"/>
      <rect x="103.5" y="110" width="17" height="6" rx="2.5" fill="${M.nutLight}"/>
      <rect x="97" y="121" width="30" height="36" rx="10" fill="${M.berry}"/>
      <g stroke="#fff" stroke-opacity=".25" stroke-width="2" stroke-linecap="round">
        <line x1="103" y1="128" x2="121" y2="128"/><line x1="103" y1="151" x2="121" y2="151"/>
      </g>
      <path d="M112 147 C104 141 104 134.5 108.2 134.5 C110.2 134.5 111.4 135.7 112 137 C112.6 135.7 113.8 134.5 115.8 134.5 C120 134.5 120 141 112 147Z" fill="#F7D9CF"/>
      <ellipse cx="97" cy="142" rx="6.5" ry="8" fill="${M.fur}"/>
      <ellipse cx="127" cy="142" rx="6.5" ry="8" fill="${M.fur}"/>`;
  } else if (v === 'enerjik') {
    front = `
      <ellipse cx="99" cy="133" rx="7.5" ry="9.5" fill="${M.furDark}"/>
      <ellipse cx="143" cy="118" rx="7" ry="12" fill="${M.furDark}" transform="rotate(-38 143 118)"/>
      <g transform="translate(158 96) rotate(28)">
        <path d="M0 -17 C10 -8 10 8 0 17 C-10 8 -10 -8 0 -17Z" fill="${M.sprout}"/>
        <path d="M0 -14 L0 21" stroke="${M.sproutDark}" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <ellipse cx="149" cy="108" rx="6" ry="6.5" fill="${M.fur}"/>`;
  } else if (v === 'parilti' || v === 'sakin') {
    front = `
      <ellipse cx="100" cy="133" rx="7.5" ry="9.5" fill="${M.furDark}"/>
      <ellipse cx="124" cy="133" rx="7.5" ry="9.5" fill="${M.furDark}"/>`;
  } else if (v === 'findik') {
    front = `
      ${nutShape(112, 136, 1)}
      <ellipse cx="99" cy="137" rx="7" ry="9" fill="${M.furDark}"/>
      <ellipse cx="125" cy="137" rx="7" ry="9" fill="${M.furDark}"/>
      ${nutShape(156, 184, 0.55)}${nutShape(168, 187, 0.5)}${nutShape(161, 174, 0.48)}`;
  }

  const sparkles = v === 'parilti'
    ? star(164, 50, 10, M.gold) + star(176, 80, 5.5, M.gold) + star(148, 26, 5.5, M.gold) + star(22, 64, 7, M.gold) + star(30, 30, 4.5, M.gold)
    : '';

  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label}">
  <defs>
    <radialGradient id="sc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="${M.gold}" stop-opacity=".38"/>
      <stop offset="1" stop-color="${M.gold}" stop-opacity="0"/>
    </radialGradient>
  </defs>
  ${glow}
  <g fill="${M.tail}">${tail}</g>
  ${tailHi}
  <ellipse cx="112" cy="146" rx="38" ry="40" fill="${M.fur}"/>
  <ellipse cx="112" cy="154" rx="24" ry="28" fill="${M.cream}"/>
  ${feet}
  ${blanket}
  <path d="M80 66 C74 48 78 34 86 26 C96 34 102 48 100 62Z" fill="${M.fur}"/>
  <path d="M144 66 C150 48 146 34 138 26 C128 34 122 48 124 62Z" fill="${M.fur}"/>
  <path d="M84 62 C81 50 83 41 87 35 C93 42 96 51 95 61Z" fill="${M.earIn}"/>
  <path d="M140 62 C143 50 141 41 137 35 C131 42 128 51 129 61Z" fill="${M.earIn}"/>
  <path d="M86 27 C84 21 86 15 90 10 C90 16 92 21 89 28Z" fill="${M.furDark}"/>
  <path d="M138 27 C140 21 138 15 134 10 C134 16 132 21 135 28Z" fill="${M.furDark}"/>
  <ellipse cx="112" cy="90" rx="42" ry="37" fill="${M.fur}"/>
  <circle cx="86" cy="103" r="${cheekR}" fill="${M.cream}"/>
  <circle cx="138" cy="103" r="${cheekR}" fill="${M.cream}"/>
  <ellipse cx="112" cy="104" rx="14" ry="11" fill="${M.cream}"/>
  ${v === 'regl' ? closedEyes : openEyes(v === 'parilti')}
  <path d="M106.5 97.5 Q112 94.5 117.5 97.5 Q115.5 102.5 112 102.8 Q108.5 102.5 106.5 97.5Z" fill="${M.nose}"/>
  <path d="M106 106 Q109 109.5 112 106.5 Q115 109.5 118 106" fill="none" stroke="${M.nose}" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="83" cy="107" rx="7.5" ry="4.5" fill="${M.blush}" opacity="${v === 'regl' ? .7 : .5}"/>
  <ellipse cx="141" cy="107" rx="7.5" ry="4.5" fill="${M.blush}" opacity="${v === 'regl' ? .7 : .5}"/>
  ${front}
  ${sparkles}
</svg>`;
}

if (typeof module !== 'undefined') module.exports = { mascotSVG, M };

/* ---------- Tarih yardımcıları (gün indeksiyle çalışır, saat dilimi sorunu yok) ---------- */
const DAY_MS = 86400000;
const pad2 = n => String(n).padStart(2, '0');
const isKey = k => typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k);
const toIdx = k => { const [y, m, d] = k.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY_MS); };
const fromIdx = i => { const d = new Date(i * DAY_MS); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`; };
const todayIdx = () => { const d = new Date(); return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY_MS); };
const partsOf = i => { const d = new Date(i * DAY_MS); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), wd: (d.getUTCDay() + 6) % 7 }; };
const idxOf = (y, m, d) => Math.round(Date.UTC(y, m, d) / DAY_MS); // m: 0-11

const AYLAR = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
const GUNLER = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];
const GUN_KISA = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];

function fmtDate(i, opts = {}) {
  const p = partsOf(i);
  const yr = opts.year || (opts.today != null && partsOf(opts.today).y !== p.y) ? ` ${p.y}` : '';
  return `${p.d} ${AYLAR[p.m]}${yr}${opts.weekday ? ' ' + GUNLER[p.wd] : ''}`;
}
function fmtRange(a, b, today) {
  if (a === b) return fmtDate(a, { today });
  const pa = partsOf(a), pb = partsOf(b);
  const yr = today != null && partsOf(today).y !== pb.y ? ` ${pb.y}` : '';
  if (pa.y === pb.y && pa.m === pb.m) return `${pa.d}–${pb.d} ${AYLAR[pa.m]}${yr}`;
  return `${pa.d} ${AYLAR[pa.m]} – ${pb.d} ${AYLAR[pb.m]}${yr}`;
}
function fmtRel(n) {
  if (n === 0) return 'bugün';
  if (n === 1) return 'yarın';
  if (n === -1) return 'dün';
  return n > 1 ? `${n} gün sonra` : `${-n} gün önce`;
}

/* ---------- Döngü modeli ----------
   S = { v, cycleLen, periodLen, periods: [{ s:'YYYY-MM-DD', e:'YYYY-MM-DD'|null }] }
   e === null  → regl devam ediyor (en fazla MAX_OPEN gün açık kalır)                */
const MAX_OPEN = 10;
const clampInt = (n, lo, hi, def) => { n = Math.round(Number(n)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : def; };

function normalize(S, today) {
  S.cycleLen = clampInt(S.cycleLen, 18, 60, 28);
  S.periodLen = clampInt(S.periodLen, 2, 10, 5);
  const list = (Array.isArray(S.periods) ? S.periods : [])
    .filter(p => p && isKey(p.s))
    .map(p => ({ s: fromIdx(toIdx(p.s)), e: isKey(p.e) ? fromIdx(toIdx(p.e)) : null }))
    .sort((a, b) => toIdx(a.s) - toIdx(b.s));
  const out = [];
  for (const p of list) {
    const s = toIdx(p.s);
    if (s > today) continue;                                        // gelecekte başlangıç olmaz
    if (out.length && toIdx(out[out.length - 1].s) === s) continue; // aynı gün iki kayıt olmaz
    out.push(p);
  }
  for (let i = 0; i < out.length; i++) {
    const p = out[i], s = toIdx(p.s), next = out[i + 1];
    const limit = next ? toIdx(next.s) - 1 : today;
    if (p.e == null) {
      if (next || today - s + 1 > MAX_OPEN) p.e = fromIdx(Math.max(s, Math.min(s + S.periodLen - 1, limit)));
    } else {
      p.e = fromIdx(Math.max(s, Math.min(toIdx(p.e), limit)));
    }
  }
  S.periods = out;
  return S;
}

function analyze(S, today) {
  const P = S.periods.map(p => ({ s: toIdx(p.s), e: p.e != null ? toIdx(p.e) : null }));
  const cycles = [];
  for (let i = 1; i < P.length; i++) {
    const c = P[i].s - P[i - 1].s;
    if (c >= 15 && c <= 60) cycles.push(c);                     // uç değerler (unutulmuş kayıt vb.) ortalamaya girmez
  }
  const recent = cycles.slice(-6);
  const k = Math.max(0, 3 - recent.length);                      // az veride girilen değerle harmanla
  const avgCycle = Math.round((recent.reduce((a, b) => a + b, 0) + S.cycleLen * k) / (recent.length + k));
  const lens = P.filter(p => p.e != null).map(p => p.e - p.s + 1).filter(l => l >= 1 && l <= 12).slice(-6);
  const kp = Math.max(0, 2 - lens.length);
  const avgPeriod = Math.max(1, Math.round((lens.reduce((a, b) => a + b, 0) + S.periodLen * kp) / (lens.length + kp)));
  const minC = recent.length ? Math.min(...recent) : avgCycle;
  const maxC = recent.length ? Math.max(...recent) : avgCycle;
  const irregular = recent.length >= 3 && maxC - minC >= 8;

  const A = { P, cycles, recent, avgCycle, avgPeriod, minC, maxC, irregular, last: null, today };
  const L = P[P.length - 1];
  if (!L) return A;
  A.last = L;
  A.open = L.e == null;
  A.N = L.s + avgCycle;            // tahmini sonraki regl
  A.O = A.N - 14;                  // tahmini ovulasyon (luteal faz ~14 gün varsayımı)
  A.F0 = A.O - 5;                  // doğurgan pencere: ovulasyondan 5 gün önce → ovulasyon günü
  A.cycleDay = today - L.s + 1;
  const inPeriod = today >= L.s && today <= (L.e == null ? today : L.e);
  if (inPeriod) A.phase = 'regl';
  else if (today >= A.N) A.phase = 'gecikme';
  else if (today > A.O) A.phase = 'luteal';
  else if (today === A.O) A.phase = 'ovulasyon';
  else if (today >= A.F0) A.phase = 'dogurgan';
  else A.phase = 'folikuler';
  A.late = today - A.N;            // ≥0 ise bugün bekleniyor/gecikti
  A.rangeStart = L.s + minC;
  A.rangeEnd = L.s + maxC;
  A.B1 = A.phase === 'gecikme' ? today : A.N; // gelecek tahminlerin başladığı gün
  return A;
}

/* Bir günün türü: regl | regl-tahmin | dogurgan | ovulasyon | gecikme | duz */
function classify(A, d) {
  const P = A.P, today = A.today;
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    if (d < p.s) continue;
    if (d <= (p.e != null ? p.e : today)) return { type: 'regl', pi: i, k: d - p.s + 1 };
    break;
  }
  const L = A.last;
  if (!L) return { type: 'duz' };
  if (A.open && d > today && d <= L.s + A.avgPeriod - 1) return { type: 'regl-tahmin' };
  if (d >= L.s && d < A.N) {
    if (d === A.O) return { type: 'ovulasyon', cycleDay: d - L.s + 1 };
    if (d >= A.F0 && d < A.O) return { type: 'dogurgan', cycleDay: d - L.s + 1 };
    return { type: 'duz', cycleDay: d - L.s + 1 };
  }
  if (d >= A.N) {
    if (d < A.B1) return { type: 'gecikme', cycleDay: d - L.s + 1 };
    const off = d - A.B1;
    const Pk = A.B1 + Math.floor(off / A.avgCycle) * A.avgCycle;
    if (d - Pk < A.avgPeriod) return { type: 'regl-tahmin' };
    const Ok = Pk + A.avgCycle - 14;
    if (d === Ok) return { type: 'ovulasyon' };
    if (d >= Ok - 5 && d < Ok) return { type: 'dogurgan' };
    return { type: 'duz' };
  }
  return { type: 'duz' };
}

/* Geçmiş günler için: o güne en yakın (önceki) başlangıca göre döngü günü */
function cycleDayOf(A, d) {
  for (let i = A.P.length - 1; i >= 0; i--) if (A.P[i].s <= d) return d - A.P[i].s + 1;
  return null;
}

/* ---------- Kayıt işlemleri (hepsi normalize ile biter) ---------- */
function periodAt(S, d, today) {
  for (let i = S.periods.length - 1; i >= 0; i--) {
    const s = toIdx(S.periods[i].s);
    if (d < s) continue;
    const e = S.periods[i].e != null ? toIdx(S.periods[i].e) : today;
    return d <= e ? i : -1;
  }
  return -1;
}
function addStart(S, d, today) {
  const A = analyze(S, today);
  const e = d + A.avgPeriod - 1;
  S.periods.push({ s: fromIdx(d), e: e < today ? fromIdx(e) : null });
  return normalize(S, today);
}
function setEnd(S, i, d, today) {
  if (S.periods[i]) S.periods[i].e = fromIdx(d);
  return normalize(S, today);
}
function setStart(S, i, d, today) {
  if (S.periods[i]) S.periods[i].s = fromIdx(d);
  return normalize(S, today);
}
function removePeriod(S, i, today) {
  S.periods.splice(i, 1);
  return normalize(S, today);
}
/* Bu gün, bitmiş bir reglin 1-3 gün sonrasıysa o regl bu güne uzatılabilir */
function extendable(S, d, today) {
  if (periodAt(S, d, today) !== -1) return -1;
  for (let i = S.periods.length - 1; i >= 0; i--) {
    const p = S.periods[i];
    if (p.e == null) continue;
    const gap = d - toIdx(p.e);
    if (gap >= 1 && gap <= 3) return i;
    if (toIdx(p.s) < d) break;
  }
  return -1;
}
/* Bu gün, bir reglin birkaç gün öncesiyse o reglin başlangıcı bu güne alınabilir
   (ayrı bir regl açmak burada anlamsız olur: iki kayıt birbirine yapışır) */
function prependable(S, d, today, maxGap = 5) {
  if (periodAt(S, d, today) !== -1) return -1;
  for (let i = 0; i < S.periods.length; i++) {
    const gap = toIdx(S.periods[i].s) - d;
    if (gap >= 1 && gap <= maxGap) return i;
  }
  return -1;
}

if (typeof module !== 'undefined') module.exports = {
  toIdx, fromIdx, partsOf, idxOf, todayIdx, fmtDate, fmtRange, fmtRel, AYLAR, GUNLER, GUN_KISA,
  normalize, analyze, classify, cycleDayOf, periodAt, addStart, setEnd, setStart, removePeriod,
  extendable, prependable, MAX_OPEN
};

/* Döngü çelengi: her gün bir yaprak, regl günleri kızılcık, ovulasyon palamut.
   Koyu dal, döngüde bugüne kadar gelinen yolu gösterir. */
function wreathSVG(A) {
  const L = A.last;
  const total = Math.min(60, Math.max(A.avgCycle, T - L.s + 1));
  const cx = 150, cy = 150, R = 134, k = Math.min(1, 30 / total), step = 360 / total;
  const rad = d => d * Math.PI / 180;
  const pt = (deg, r = R) => [cx + r * Math.cos(rad(deg)), cy + r * Math.sin(rad(deg))];
  const tPos = Math.min(total - 1, T - L.s);
  let vine = `<circle cx="${cx}" cy="${cy}" r="${R}" class="vine"/>`;
  if (tPos > 0) {
    const [x0, y0] = pt(-90), [x1, y1] = pt(-90 + step * tPos);
    vine += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${step * tPos > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" class="vine-done"/>`;
  }
  let out = '';
  for (let i = 0; i < total; i++) {
    const d = L.s + i, a = -90 + step * i;
    let type = classify(A, d).type;
    if (A.phase === 'gecikme' && d >= A.N) type = 'gecikme';
    const when = d < T ? 'past' : d === T ? 'today' : 'future';
    const sc = (when === 'today' ? 1.3 : 1) * k;
    const [px, py] = pt(a);
    let g;
    if (type === 'regl' || type === 'regl-tahmin' || type === 'ovulasyon') {
      const shape = type === 'regl' ? `<circle r="6.8" class="b-on"/><circle cx="-2.2" cy="-2.4" r="1.8" class="b-hi"/>`
        : type === 'regl-tahmin' ? `<circle r="6.2" class="b-pred"/>`
        : `<circle r="11.5" class="ovu-ring"/><circle r="7.4" class="ovu"/>`;
      g = `<g class="dd" style="--i:${i}" transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) scale(${sc.toFixed(2)})">${shape}</g>`;
    } else {
      const side = i % 2 ? 1 : -1;                 // defne gibi: bir dışa, bir içe
      const th = a + 180 - side * 32;               // yaprak dal boyunca ileri bakar
      const dir = rad(th - 90);
      const lx = px + Math.cos(dir) * 6.5 * sc, ly = py + Math.sin(dir) * 6.5 * sc;
      g = `<g class="dd" style="--i:${i}" transform="translate(${lx.toFixed(1)} ${ly.toFixed(1)}) rotate(${th.toFixed(1)}) scale(${sc.toFixed(2)})"><path d="M0 -9.5 C5.2 -4.6 5.2 4.6 0 9.5 C-5.2 4.6 -5.2 -4.6 0 -9.5Z" class="lf ${type} ${when}"/><path d="M0 -7 L0 7" class="rib"/></g>`;
    }
    out += g;
    if (when === 'today') out += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${(17 * Math.max(k, .8)).toFixed(1)}" class="today-ring"/>`;
  }
  return `<svg class="wreath-svg" viewBox="0 0 300 300" aria-hidden="true">${vine}${out}</svg>`;
}

function renderHome(A) {
  const L = A.last;
  let head, line;

      else if (A.late === 0) line = 'Regl bugün bekleniyor';

    }
  }
  const rows = [];
  const nextVal = A.irregular ? fmtRange(A.rangeStart, A.rangeEnd, T) : fmtDate(A.N, { today: T });
  if (A.phase === 'gecikme') {

  const demo = PREVIEW && S.ornek
    ? `<div class="note-demo"><span>Önizleme: örnek kayıtlarla açıldı.</span><button type="button" id="act-demo">Kurulumu gör</button></div>` : '';

  $('#view').innerHTML = `
    ${demo}${warn}${install}
    <section class="hero">
      <div class="wreath${introDone ? '' : ' intro'}">

      </div>

    </section>
    <dl class="rows">${rows.map(r => `<div class="row"><dt>${r[0]}</dt><dd><span class="val">${r[1]}</span><span class="sub">${r[2]}</span></dd></div>`).join('')}</dl>
    <div class="cta">${action}</div>`;
  introDone = true;

  const m = $('#mascot');
  m.onclick = () => {
    m.classList.remove('hop'); void m.offsetWidth; m.classList.add('hop');
    if (GIZLI_NOT.metin) setTimeout(showNote, 420);
  };
  if ($('#act-start')) $('#act-start').onclick = startFlow;
  if ($('#act-end')) $('#act-end').onclick = () => endFlow(A);
  if ($('#act-cal')) $('#act-cal').onclick = () => goTab('takvim');
  if ($('#act-install')) $('#act-install').onclick = installSheet;
  if ($('#act-demo')) $('#act-demo').onclick = () => {
    wipe(); S = null; onb.step = 'hos'; onb.draft = { last: '', cycleLen: 28, periodLen: 5 }; introDone = false;
    render(); window.scrollTo(0, 0);
  };
}

/* ---------- Regl başladı / bitti ---------- */
function startFlow() {
  const acts = [{ label: 'Bugün', kind: 'berry', fn: () => doStart(T) }];
  if (periodAt(S, T - 1, T) === -1) acts.push({ label: 'Dün', kind: 'line', fn: () => doStart(T - 1) });
  acts.push({ label: 'Başka bir gün', kind: 'line', fn: () => { goTab('takvim'); toast('Başladığı güne dokun.'); } });
  acts.push({ label: 'Vazgeç', kind: 'ghost' });
  openSheet({ title: 'Regl ne zaman başladı?', actions: acts });
}
function doStart(d) {
  if (periodAt(S, d, T) !== -1) { toast('Bu gün zaten regl olarak kayıtlı.'); return; }
  const ex = extendable(S, d, T);
  if (ex !== -1 && d - toIdx(S.periods[ex].s) < 15) {
    openSheet({
      title: 'Önceki regl yeni bitmişti',
      body: `<p class="sheet-info">Önceki regl ${fmtDate(toIdx(S.periods[ex].e))} günü bitmiş olarak kayıtlı.</p>`,
      actions: [
        { label: 'Aynı regl, devam ediyor', kind: 'moss', fn: () => commit(() => {
          const p = S.periods[ex];
          p.e = T - toIdx(p.s) + 1 < MAX_OPEN ? null : fromIdx(T);   // çok uzadıysa bugünle kapat
        }, 'Regl devam ediyor olarak güncellendi') },
        { label: 'Yeni regl başladı', kind: 'line', fn: () => commit(() => addStart(S, d, T), 'Regl başlangıcı kaydedildi') },
        { label: 'Vazgeç', kind: 'ghost' }
      ]
    });
    return;
  }
  commit(() => addStart(S, d, T), 'Regl başlangıcı kaydedildi');
}
function endFlow(A) {
  const i = S.periods.length - 1;
  const acts = [{ label: 'Bugün', kind: 'moss', fn: () => commit(() => setEnd(S, i, T, T), 'Regl bitişi kaydedildi') }];
  if (T - 1 >= A.last.s) acts.push({ label: 'Dün', kind: 'line', fn: () => commit(() => setEnd(S, i, T - 1, T), 'Regl bitişi kaydedildi') });
  acts.push({ label: 'Vazgeç', kind: 'ghost' });
  openSheet({ title: 'Son gün hangisiydi?', actions: acts });
}

/* ---------- Takvim ---------- */
function renderCalendar(A) {
  if (!calMonth) { const p = partsOf(T); calMonth = { y: p.y, m: p.m }; }
  const { y, m } = calMonth;
  const first = idxOf(y, m, 1);
  const days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const cells = [];
  for (let i = 0; i < partsOf(first).wd; i++) cells.push(null);
  for (let i = 0; i < days; i++) cells.push(first + i);
  while (cells.length % 7) cells.push(null);
  const info = cells.map(d => d == null ? null : classify(A, d));
  const band = c => !c ? '' : c.type === 'regl' ? 'r' : (c.type === 'dogurgan' || c.type === 'ovulasyon') ? 'g' : '';
  const NAMES = { regl: 'regl', 'regl-tahmin': 'tahmini regl', dogurgan: 'doğurgan dönem', ovulasyon: 'tahmini ovulasyon', gecikme: '', duz: '' };
  let grid = '';
  cells.forEach((d, idx) => {
    if (d == null) { grid += `<div class="day empty" aria-hidden="true"></div>`; return; }
    const c = info[idx], b = band(c), col = idx % 7;
    const cls = ['day', c.type];
    if (b) {
      cls.push('band-' + b);
      if (col === 0 || band(info[idx - 1]) !== b) cls.push('bs');
      if (col === 6 || band(info[idx + 1]) !== b) cls.push('be');
    }
    if (d === T) cls.push('today');
    if (d > T) cls.push('future');
    const label = `${fmtDate(d, { weekday: true })}${NAMES[c.type] ? ', ' + NAMES[c.type] : ''}${d === T ? ', bugün' : ''}`;
    grid += `<button type="button" class="${cls.join(' ')}" data-d="${d}" aria-label="${label}"><span>${partsOf(d).d}</span></button>`;
  });

  $('#view').innerHTML = `
    <div class="cal-head">
      <button class="nav-btn" id="cal-prev" type="button" aria-label="Önceki ay">‹</button>
      <h1>${AYLAR[m]} ${y}</h1>
      <button class="nav-btn" id="cal-next" type="button" aria-label="Sonraki ay">›</button>
    </div>
    <div class="wk" aria-hidden="true">${GUN_KISA.map(g => `<span>${g}</span>`).join('')}</div>
    <div class="grid">${grid}</div>
    <ul class="legend">
      <li><i class="sw sw-r"></i>Regl</li><li><i class="sw sw-p"></i>Tahmini regl</li>
      <li><i class="sw sw-g"></i>Doğurgan dönem</li><li><i class="sw sw-o"></i>Ovulasyon</li>
    </ul>
    ${historyHTML(A)}`;

  $('#cal-prev').onclick = () => { calMonth = m === 0 ? { y: y - 1, m: 11 } : { y, m: m - 1 }; render(); };
  $('#cal-next').onclick = () => { calMonth = m === 11 ? { y: y + 1, m: 0 } : { y, m: m + 1 }; render(); };
  document.querySelectorAll('.day[data-d]').forEach(b => { b.onclick = () => daySheet(+b.dataset.d, A); });
}

function historyHTML(A) {
  const P = A.P;
  let summary;
  if (!A.recent.length) summary = 'İkinci regl kaydedildiğinde döngü süren hesaplanmaya başlar. Şimdilik girdiğin süreler kullanılıyor.';
  else summary = `Ortalama döngün ${A.avgCycle} gün, reglin ${A.avgPeriod} gün sürüyor.` +
    (A.recent.length < 3 ? ' Üç döngü kaydedilene kadar girdiğin süreler de hesaba katılıyor.' : '');
  const rows = [];
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i], end = p.e != null ? p.e : T, next = P[i + 1];
    const right = next
      ? `<span class="when">${next.s - p.s} gün</span><span class="meta">döngü</span>`
      : `<span class="when">${T - p.s + 1}. gün</span><span class="meta">şu anki döngü</span>`;
    rows.push(`<div class="hrow"><div><span class="when">${fmtRange(p.s, end, T)}</span><span class="meta">${p.e == null ? 'regl devam ediyor' : `regl ${end - p.s + 1} gün`}</span></div><div class="right">${right}</div></div>`);
  }
  return `<section class="hist"><h2>Geçmiş</h2><p class="summary">${summary}</p>${rows.join('')}</section>`;
}

function daySheet(d, A) {
  const c = classify(A, d);
  let info = '';
  if (c.type === 'regl') info = `Regl, ${c.k}. gün`;
  else if (c.type === 'regl-tahmin') info = 'Tahmini regl günü';
  else if (c.type === 'ovulasyon') info = 'Tahmini ovulasyon günü';
  else if (c.type === 'dogurgan') info = 'Doğurgan dönem, tahmini';
  else if (c.type === 'gecikme') info = `Döngünün ${c.cycleDay}. günü, regl bekleniyordu`;
  else {
    const cd = d <= T ? cycleDayOf(A, d) : c.cycleDay;
    if (cd) info = `Döngünün ${cd}. günü`;
  }
  const acts = [];
  if (d <= T) {
    const pi = periodAt(S, d, T);
    if (pi !== -1) {
      const p = S.periods[pi];
      if (p.e == null || toIdx(p.e) !== d) acts.push({ label: 'Regl bu gün bitti', kind: 'moss', fn: () => commit(() => setEnd(S, pi, d, T), 'Regl bitişi kaydedildi') });
      acts.push({ label: 'Bu regl kaydını sil', kind: 'danger', fn: () => commit(() => removePeriod(S, pi, T), 'Regl kaydı silindi') });
    } else {
      const ex = extendable(S, d, T);
      const pre = prependable(S, d, T, A.avgPeriod);
      if (ex !== -1) acts.push({ label: 'Önceki regli bu güne uzat', kind: 'moss', fn: () => commit(() => setEnd(S, ex, d, T), 'Regl uzatıldı') });
      if (pre !== -1) acts.push({ label: 'Başlangıcı bu güne al', kind: 'berry', fn: () => commit(() => setStart(S, pre, d, T), 'Başlangıç günü güncellendi') });
      else acts.push({ label: 'Regl bu gün başladı', kind: 'berry', fn: () => commit(() => addStart(S, d, T), 'Regl başlangıcı kaydedildi') });
    }
  }
  acts.push({ label: 'Kapat', kind: 'ghost' });
  openSheet({ title: fmtDate(d, { weekday: true, today: T }), body: info ? `<p class="sheet-info">${info}</p>` : '', actions: acts });
}

/* ---------- Ayarlar ---------- */
function stepper(key, label, val, lo, hi) {
  return `<div class="step-row"><span class="step-label">${label}</span>
    <div class="stepper" data-key="${key}" data-lo="${lo}" data-hi="${hi}">
      <button type="button" data-dir="-1" aria-label="${label}: azalt">−</button>
      <output aria-live="polite">${val} gün</output>
      <button type="button" data-dir="1" aria-label="${label}: artır">+</button>
    </div></div>`;
}
function bindSteppers(get, set) {
  document.querySelectorAll('.stepper').forEach(st => {
    st.querySelectorAll('button').forEach(b => {
      b.onclick = () => {
        const key = st.dataset.key, lo = +st.dataset.lo, hi = +st.dataset.hi;
        const v = Math.min(hi, Math.max(lo, get(key) + +b.dataset.dir));
        set(key, v);
        st.querySelector('output').textContent = `${v} gün`;
      };
    });
  });
}
function renderSettings() {
  $('#view').innerHTML = `
    <section class="set">
      <h2>Döngü ve regl</h2>
      ${stepper('cycleLen', 'Döngü süresi', S.cycleLen, 18, 60)}
      ${stepper('periodLen', 'Regl süresi', S.periodLen, 2, 10)}
      <p class="hint">Bunlar başlangıç değerleri. Kayıt biriktikçe tahminler kendi döngülerinle hesaplanır.</p>
    </section>
    <section class="set">
      <h2>Kayıtlar</h2>
      ${!PREVIEW && ENV.mobile && !ENV.standalone() ? `<button class="row-btn" id="s-install" type="button">Ana ekrana ekle</button>` : ''}
      <button class="row-btn" id="s-export" type="button">Yedek al</button>
      <button class="row-btn" id="s-import" type="button">Yedekten geri yükle</button>
      <input type="file" id="s-file" accept=".json,.txt,application/json,text/plain" hidden>
      <p class="hint">Telefon değiştirirken yedeği yeni telefonda geri yükle.</p>
    </section>
    <section class="set">
      <h2>Gizlilik</h2>
      <p>Kayıtların sadece bu telefonda saklanır. Hesap yok, sunucu yok, reklam yok. Uygulamayı yapan dahil kimse göremez.</p>
    </section>
    <section class="set">
      <h2>Tahminler</h2>
      <p>Tahminler son döngülerinin ortalamasına dayanır. Ovulasyon, sonraki reglden 14 gün önce varsayılır. Doğum kontrol yöntemi olarak kullanılmamalı.</p>
    </section>
    <section class="set">
      <button class="btn danger" id="s-reset" type="button">Tüm kayıtları sil</button>
      <p class="version">Sincap ${SURUM}</p>
    </section>`;
  bindSteppers(k => S[k], (k, v) => { S[k] = v; normalize(S, T); save(); });
  if ($('#s-install')) $('#s-install').onclick = installSheet;
  $('#s-export').onclick = exportData;
  $('#s-import').onclick = () => $('#s-file').click();
  $('#s-file').onchange = importData;
  $('#s-reset').onclick = () => openSheet({
    title: 'Tüm kayıtlar silinsin mi?',
    body: '<p class="sheet-info">Bu işlem geri alınamaz. Önce yedek almak isteyebilirsin.</p>',
    actions: [
      { label: 'Hepsini sil', kind: 'danger', fn: () => { wipe(); S = null; onb.step = 'hos'; onb.draft = { last: '', cycleLen: 28, periodLen: 5 }; tab = 'bugun'; introDone = false; render(); window.scrollTo(0, 0); } },
      { label: 'Vazgeç', kind: 'ghost' }
    ]
  });
}

async function exportData() {
  if (PREVIEW) { toast('Önizlemede dosya indirilemiyor. Yayınlanan uygulamada çalışır.'); return; }
  const text = JSON.stringify({ uygulama: 'sincap', surum: 1, tarih: new Date().toISOString(), veri: S }, null, 2);
  const name = `sincap-yedek-${fromIdx(T)}.json`;
  try {
    const file = new File([text], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Sincap yedeği' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Yedek dosyası indirildi.');
}
async function importData(ev) {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  let data;
  try {
    const o = JSON.parse(await f.text());
    data = o && o.veri ? o.veri : o;
    if (!data || !Array.isArray(data.periods) || !data.periods.length) throw new Error('bos');
  } catch (e) { toast('Bu dosya bir Sincap yedeği değil.'); return; }
  openSheet({
    title: 'Yedek geri yüklensin mi?',
    body: `<p class="sheet-info">Yedekte ${data.periods.length} regl kaydı var. Şu anki kayıtların yerini alacak.</p>`,
    actions: [
      { label: 'Geri yükle', kind: 'moss', fn: () => {
        const before = JSON.stringify(S);
        S = normalize({ v: 1, cycleLen: data.cycleLen, periodLen: data.periodLen, periods: data.periods }, T);
        if (!S.periods.length) { S = JSON.parse(before); toast('Yedekte geçerli bir kayıt bulunamadı.'); return; }
        if (!save()) { S = JSON.parse(before); return; }
        render(); toast('Yedek geri yüklendi.');
      } },
      { label: 'Vazgeç', kind: 'ghost' }
    ]
  });
}

/* ---------- Ana ekrana ekleme ---------- */
function installInfo() {
  if (ENV.inApp) return {
    title: 'Önce tarayıcıda aç',
    body: `<p>Bu sayfa bir uygulamanın kendi tarayıcısında açıldı. Buradan ana ekrana eklenemiyor.</p>
      <ol class="steps"><li>Sağ üstteki menüye dokun.</li><li>${ENV.ios ? 'Safari’de aç' : 'Chrome’da aç'} seçeneğini seç.</li></ol>`
  };
  if (ENV.ios) return {
    title: 'Önce ana ekrana ekle',
    body: `<p>Tarayıcıda kalırsa iPhone, bir süre açılmayan sitelerin kayıtlarını silebiliyor. Ana ekrandaki uygulamada kayıtların güvende kalır.</p>
      <ol class="steps">
        <li>Safari’de Paylaş simgesine dokun. iOS 26’da önce alttaki ••• düğmesine dokunman gerekebilir.</li>
        <li>Ana Ekrana Ekle’yi seç, sonra Ekle’ye dokun.</li>
        <li>Bu sayfayı kapat ve ana ekrandaki Sincap simgesinden aç.</li>
      </ol>
      <p class="hint">Ana ekrandaki uygulama Safari’den ayrı bir kayıt alanı kullanır. Bu yüzden kurulumu oradan yap.</p>`
  };
  if (ENV.android) return {
    title: 'Ana ekrana ekle',
    body: `<p>Ana ekrana eklersen uygulama gibi açılır ve internetsiz de çalışır.</p>` +
      (deferredPrompt ? '' : `<ol class="steps"><li>Sağ üstteki ⋮ menüsüne dokun.</li><li>Ana ekrana ekle ya da Uygulamayı yükle seçeneğini seç.</li></ol>`)
  };
  return { title: 'Telefonda aç', body: `<p>Sincap telefonda kullanılmak için tasarlandı. Bu adresi telefonunda açıp ana ekrana ekle.</p>` };
}
async function promptInstall() {
  if (!deferredPrompt) return false;
  deferredPrompt.prompt();
  const r = await deferredPrompt.userChoice.catch(() => null);
  deferredPrompt = null;
  return !!(r && r.outcome === 'accepted');
}
function installSheet() {
  const inf = installInfo();
  const acts = [];
  if (ENV.android && deferredPrompt) acts.push({ label: 'Ana ekrana ekle', kind: 'moss', fn: async () => { if (await promptInstall()) toast('Ana ekrana eklendi.'); } });
  acts.push({ label: 'Tamam', kind: 'ghost' });
  openSheet({ title: inf.title, body: `<div class="sheet-body">${inf.body}</div>`, actions: acts });
}

/* ---------- İlk açılış ---------- */
function renderOnboarding() {
  const v = $('#view');
  if (onb.step === 'hos') {
    v.innerHTML = `<section class="onb-hos">
      <div class="onb-mascot">${mascotSVG('enerjik')}</div>
      <h1 class="onb-word">Sincap</h1>
      <p class="onb-lead">Reglini ve döngünü takip etmenin sade bir yolu.</p>
      <p class="onb-privacy">Kayıtların sadece bu telefonda saklanır. Hesap yok, sunucu yok, reklam yok. Uygulamayı yapan dahil kimse göremez.</p>
      <button class="btn moss big" id="o-next" type="button">Başlayalım</button>
    </section>`;
    $('#o-next').onclick = () => { onb.step = (ENV.mobile && !ENV.standalone()) || ENV.inApp ? 'kur' : 'ayar'; render(); window.scrollTo(0, 0); };
    return;
  }
  if (onb.step === 'kur') {
    const inf = installInfo();
    const androidPrompt = ENV.android && !ENV.inApp && deferredPrompt;
    let buttons;
    if (androidPrompt) buttons = `<button class="btn moss big" id="o-inst" type="button">Ana ekrana ekle</button><button class="link-btn" id="o-skip" type="button">Devam et</button>`;
    else if (ENV.android && !ENV.inApp) buttons = `<button class="btn moss big" id="o-skip" type="button">Ekledim, devam et</button>`;
    else buttons = `<button class="link-btn" id="o-skip" type="button">Yine de tarayıcıda devam et</button>`;
    v.innerHTML = `<section class="onb-sec">
      <div class="onb-mini">${mascotSVG('sakin')}</div>
      <h1>${inf.title}</h1>
      ${inf.body}
      <div class="onb-buttons">${buttons}</div>
    </section>`;
    if ($('#o-inst')) $('#o-inst').onclick = async () => { if (await promptInstall()) toast('Ana ekrana eklendi.'); onb.step = 'ayar'; render(); };
    $('#o-skip').onclick = () => { onb.step = 'ayar'; render(); window.scrollTo(0, 0); };
    return;
  }
  const D = onb.draft;
  v.innerHTML = `<section class="onb-sec onb-ayar">
    <h1>Son reglin ne zaman başladı?</h1>
    <label class="date-field">
      <span class="date-display${D.last ? '' : ' empty'}" id="o-date-text" aria-hidden="true">${D.last ? fmtDate(toIdx(D.last), { weekday: true, today: T }) : 'Gün seç'}</span>
      <input type="date" id="o-date" max="${fromIdx(T)}" value="${esc(D.last)}" aria-label="Son reglin başladığı gün">
    </label>
    <p class="hint">Tam hatırlamıyorsan yaklaşık bir gün seç.</p>
    <div class="q"><h2>Döngün genelde kaç gün?</h2>${stepper('cycleLen', 'Döngü süresi', D.cycleLen, 18, 60)}<p class="hint">Bilmiyorsan 28 kalsın.</p></div>
    <div class="q"><h2>Reglin genelde kaç gün sürer?</h2>${stepper('periodLen', 'Regl süresi', D.periodLen, 2, 10)}</div>
    <p class="err" id="o-err" role="alert"></p>
    <button class="btn moss big" id="o-save" type="button">Kaydet ve başla</button>
  </section>`;
  bindSteppers(k => D[k], (k, val) => { D[k] = val; });
  const dateIn = $('#o-date');
  // Masaüstünde metin alanına tıklamak takvimi açmıyor; telefonlar zaten kendi seçicisini açar
  if (!ENV.mobile) dateIn.addEventListener('click', () => { try { dateIn.showPicker(); } catch (e) {} });
  const onDate = () => {
    D.last = dateIn.value;
    const tx = $('#o-date-text');
    tx.textContent = D.last ? fmtDate(toIdx(D.last), { weekday: true, today: T }) : 'Gün seç';
    tx.classList.toggle('empty', !D.last);
    $('#o-err').textContent = '';
  };
  dateIn.addEventListener('change', onDate);
  dateIn.addEventListener('input', onDate);
  $('#o-save').onclick = () => {
    const val = dateIn.value;
    const err = $('#o-err');
    if (!val) { err.textContent = 'Başlangıç gününü seç.'; return; }
    const d = toIdx(val);
    if (d > T) { err.textContent = 'Gelecekte bir gün seçilemez.'; return; }
    if (T - d > 365) { err.textContent = 'Son bir yıl içinden bir gün seç.'; return; }
    S = { v: 1, cycleLen: D.cycleLen, periodLen: D.periodLen, periods: [], olusturma: new Date().toISOString() };
    addStart(S, d, T);
    if (!save()) { S = null; return; }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    tab = 'bugun'; introDone = false;
    render(); window.scrollTo(0, 0);
  };
}

function goTab(t) {
  tab = t;
  if (t === 'takvim') calMonth = null;
  render();
  window.scrollTo(0, 0);
}

/* ---------- Başlat ---------- */
document.querySelectorAll('.tabs button').forEach(b => { b.onclick = () => goTab(b.dataset.tab); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S && todayIdx() !== T) { normalize(S, todayIdx()); save(); render(); }
});
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  if (!S && onb.step === 'kur') render();
});
window.addEventListener('appinstalled', () => { deferredPrompt = null; });
if (!PREVIEW && 'serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}

document.documentElement.lang = 'tr';
S = load() || (PREVIEW ? sampleState() : null);
if (S) { normalize(S, T); save(); }
render();

})();
</script>
